<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canary Research Venture S.L.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 550px;
            width: 100%;
            border-top: 6px solid #006699;
        }
        .icon-container {
            margin-bottom: 25px;
        }
        .icon-container svg {
            width: 64px;
            height: 64px;
            fill: #006699;
        }
        h1 {
            font-size: 2.2rem;
            color: #111111;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 1.2rem;
            color: #666666;
            font-weight: 300;
            line-height: 1.6;
        }
        .divider {
            height: 2px;
            width: 60px;
            background-color: #e0e0e0;
            margin: 30px auto;
        }
        .footer {
            font-size: 0.85rem;
            color: #999999;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <!-- Icono minimalista que representa investigación/futuro -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
        </div>
        <h1>Canary Research Venture S.L.</h1>
        <p>Bienvenidos, más detalles próximamente</p>
        <div class="divider"></div>
        <div class="footer">
            &copy; 2026 Canary Research Venture S.L. Todos los derechos reservados.
        </div>
    </div>

</body>
</html>
